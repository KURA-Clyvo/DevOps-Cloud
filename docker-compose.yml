# =============================================================================
# KURA · Infraestrutura Completa · docker-compose.yml
# Orquestra: Oracle XE · .NET API (Clínica) · Java API (Tutor) · Luna IA
# FIAP Challenge 2026 — DevOps Tools & Cloud Computing
#
# USO:
#   docker compose --env-file .env up -d
#   docker compose logs -f
#   docker compose down -v   (remove containers + volume)
# =============================================================================
# ─── Named Volume (RUBRICA 2.3) ──────────────────────────────────────────────
# Dado do banco persiste entre reinicializações do container.
volumes:
  kura-oracle-data:
    name: kura_oracle_data
  # PDFs de receituário (Documento.DsCaminho) — sem isto, os arquivos vivem só na
  # camada gravável do container e somem em todo `docker compose down`/recreate
  # (não precisa de `-v` para sumir: a troca de container já é suficiente).
  kura-storage-documentos:
    name: kura_storage_documentos

# ─── Rede Interna ─────────────────────────────────────────────────────────────
networks:
  kura-net:
    driver: bridge
    name: kura_network

# =============================================================================
services:

  # ───────────────────────────────────────────────────────────────────────────
  # 1. BANCO DE DADOS — Oracle XE 21c (slim)
  #    Imagem sugerida pela FIAP: gvenzl/oracle-xe
  #    Porta interna 1521 → exposta na VM como 9092
  # ───────────────────────────────────────────────────────────────────────────
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    shm_size: '1g' 
    container_name: kura_oracle_db
    restart: unless-stopped
    ports:
      - "9092:1521"
    environment:
      # Senha do usuário SYS/SYSTEM
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-KuraFiap@2026}
      # Usuário de aplicação criado automaticamente pela imagem
      APP_USER: ${ORACLE_APP_USER:-RM562999}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-fiap2026}
    volumes:
      # RUBRICA 2.3 — Volume nomeado para persistência de dados
      - kura-oracle-data:/opt/oracle/oradata
      # Sem bootstrap manual: o Flyway (kura-tutor) cria o schema completo
      # (V1→V12+) contra o banco vazio na primeira subida. Ver README.
    networks:
      - kura-net
    healthcheck:
      # Aguarda Oracle estar aceitando conexões antes de subir as APIs
      test: ["CMD-SHELL", "lsnrctl status | grep -qi 'xepdb1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s

  # ───────────────────────────────────────────────────────────────────────────
  # 1.5. INIT — prepara o volume de storage do receituário para o usuário
  #      não-root do kura-api (RUBRICA 2.2 proíbe rodar o serviço como root).
  #      Um named volume novo nasce root:root; este passo roda uma única vez,
  #      como root, só para criar a pasta e entregar a posse ao usuário 'kura'
  #      (mesma imagem do kura-api — reaproveita o /etc/passwd que já o define).
  # ───────────────────────────────────────────────────────────────────────────
  kura-storage-init:
    image: kura-dotnet-api:latest
    container_name: kura_storage_init
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - "mkdir -p \"$$STORAGE_BASE_PATH\" && chown -R kura:kura \"$$STORAGE_BASE_PATH\""
    environment:
      STORAGE_BASE_PATH: ${STORAGE_BASE_PATH:-/data/kura/receituarios}
    volumes:
      - kura-storage-documentos:${STORAGE_BASE_PATH:-/data/kura/receituarios}
    networks:
      - kura-net

  # ───────────────────────────────────────────────────────────────────────────
  # 2. .NET API — Backend Clínica (ASP.NET Core 10)
  #    Clean Architecture: Domain · Application · Infrastructure · Api
  #    Autenticação: JWT + API Key (IoT/Luna)
  #    Porta: 8080
  # ───────────────────────────────────────────────────────────────────────────
  kura-api:
    build:
      context: ./dotnet-backend
      dockerfile: Dockerfile
    image: kura-dotnet-api:latest
    container_name: kura_dotnet_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      # Aponta para o container oracle-db (nome do serviço = hostname na rede)
      ConnectionStrings__DefaultConnection: "User Id=${ORACLE_APP_USER:-RM562999};Password=${ORACLE_APP_PASSWORD:-fiap2026};Data Source=oracle-db:1521/XEPDB1"
      Jwt__Key: ${DOTNET_JWT_KEY:-kura-api-secret-key-fiap-2026-clyvovet}
      Jwt__Issuer: kura-api
      Jwt__Audience: kura-client
      IoT__ApiKey: ${IOT_API_KEY:-kura-iot-device-key-2026}
      Luna__ApiKey: ${LUNA_API_KEY:-kura-luna-integration-key-2026}
      # FEAT-01 — Teleconsulta (Daily.co). Binding confirmado em
      # ServiceCollectionExtensions.cs: configuration["Daily:ApiKey"] → env Daily__ApiKey.
      Daily__ApiKey: ${DAILY_API_KEY:-kura-daily-dummy-key-2026}
      # FEAT-02 — Transcrição de áudio → draft SOAP via Luna. Binding confirmado:
      # configuration["Luna:BaseUrl"]/["Luna:InboundApiKey"] → Luna__BaseUrl/Luna__InboundApiKey.
      # Luna__BaseUrl aponta pro serviço luna-ai na rede interna (nome do serviço = hostname).
      Luna__BaseUrl: ${LUNA_BASE_URL:-http://luna-ai:8000}
      # Mesma variável já usada pelo serviço luna-ai (LUNA_INBOUND_API_KEY) — não duplicar
      # literal: é a chave que o .NET manda no header X-API-Key e que a Luna valida no inbound
      # (src/web/dependencies.py::validar_api_key). Tem que ser o MESMO valor dos dois lados.
      Luna__InboundApiKey: ${LUNA_INBOUND_API_KEY:-kura-luna-inbound-key-2026}
      # FEAT-03 — Receituário (QuestPDF). Binding confirmado em ReceituarioPdfService.cs:
      # configuration["Storage:BasePath"] → env Storage__BasePath. Caminho gravável pelo
      # usuário não-root 'kura' — ver serviço kura-storage-init acima.
      Storage__BasePath: ${STORAGE_BASE_PATH:-/data/kura/receituarios}
    volumes:
      - kura-storage-documentos:${STORAGE_BASE_PATH:-/data/kura/receituarios}
    depends_on:
      oracle-db:
        condition: service_healthy
      kura-storage-init:
        condition: service_completed_successfully
    # RUBRICA 2.2 — Usuário sem privilégios (definido no próprio Dockerfile)
    # O Dockerfile .NET já cria e ativa o usuário 'kura' (não-root).
    networks:
      - kura-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ───────────────────────────────────────────────────────────────────────────
  # 3. JAVA API — Backend Tutor (Spring Boot 3.2 · Java 21)
  #    Bounded contexts: auth · onboarding · tutor · timeline · agendamento
  #    JWT stateless · Caffeine cache · Flyway migrations
  #    Porta: 8081
  # ───────────────────────────────────────────────────────────────────────────
  kura-tutor:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    image: kura-java-tutor:latest
    container_name: kura_java_tutor
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Sem override de baseline-version: banco nasce vazio (sem bootstrap),
      # então o baseline-version: "0" do application-prod.yml já é o correto
      # e o Flyway aplica V1→V12+ do zero.
      # Aponta para o container oracle-db
      DB_URL: jdbc:oracle:thin:@//oracle-db:1521/XEPDB1
      DB_USERNAME: ${ORACLE_APP_USER:-RM562999}
      DB_PASSWORD: ${ORACLE_APP_PASSWORD:-fiap2026}
      JWT_SECRET: ${JAVA_JWT_SECRET:-kura-java-secret-change-me-64-bytes-minimum-fiap-challenge-2026}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006}
    depends_on:
      oracle-db:
        condition: service_healthy
    # RUBRICA 2.2 — Usuário sem privilégios
    # O Dockerfile Java já cria e ativa o usuário 'spring' (uid=1000, não-root).
    networks:
      - kura-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ───────────────────────────────────────────────────────────────────────────
  # 4. LUNA IA — Python · FastAPI · YOLOv8n · MobileNetV3
  #    Comunicação proativa: lembretes de vacinas (Twilio) + identificação de raça
  #    Consome a .NET API para salvar triagens e recuperar dados de tutores
  #    Porta: 8000
  # ───────────────────────────────────────────────────────────────────────────
  luna-ai:
    build:
      context: ./luna-ia/luna
      dockerfile: Dockerfile
    image: kura-luna-ai:latest
    container_name: kura_luna_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    # RUBRICA 2.2 — Usuário sem privilégios
    # O Dockerfile Luna não define USER, então forçamos via compose.
    # UID/GID 1000 é um usuário não-privilegiado padrão em Linux.
    user: "1000:1000"
    environment:
      # Oracle (thin mode — sem Instant Client)
      ORACLE_DSN: oracle-db:1521/XEPDB1
      ORACLE_USER: ${ORACLE_APP_USER:-RM562999}
      ORACLE_PASSWORD: ${ORACLE_APP_PASSWORD:-fiap2026}
      # Integração com a .NET API (nome do serviço = hostname na rede interna)
      KURA_API_BASE_URL: http://kura-api:8080
      KURA_API_KEY: ${LUNA_API_KEY:-kura-luna-integration-key-2026}
      KURA_API_TIMEOUT: "10"
      # Auth inbound do endpoint POST /whatsapp/enviar (mobile-clinica-rn → Luna direto).
      # Sem isto, LUNA_INBOUND_API_KEY fica "" (default do settings.py) e o endpoint
      # rejeita 100% das chamadas com 401 — precisa bater com EXPO_PUBLIC_LUNA_API_KEY do app.
      LUNA_INBOUND_API_KEY: ${LUNA_INBOUND_API_KEY:-kura-luna-inbound-key-2026}
      # Twilio (preencher no .env)
      TWILIO_SID: ${TWILIO_SID:-}
      TWILIO_TOKEN: ${TWILIO_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-+14155238886}
      # Pesos dos modelos de IA
      YOLO_WEIGHTS_PATH: src/ai/models/yolov8n.pt
      BREED_CLASSIFIER_WEIGHTS_PATH: src/ai/models/breed_classifier.pth
      # Servidor HTTP
      LUNA_HTTP_PORT: "8000"
      WEBHOOK_PUBLIC_URL: ${WEBHOOK_PUBLIC_URL:-https://your-ngrok-url.ngrok.io/webhook/twilio/whatsapp}
      LOG_LEVEL: INFO
      PYTHONPATH: /app
    depends_on:
      kura-api:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
    networks:
      - kura-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
