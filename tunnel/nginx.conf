# REC-05b — gateway unico do Cloudflare quick tunnel (um hostname so => um proxy que
# multiplexa por prefixo). Roteia SOMENTE as 3 APIs; qualquer outro path => 404.
# O Oracle (1521/9092) nao e roteado: nao ha `stream {}` neste arquivo e nenhum
# upstream aponta para oracle-db. O servico nao publica porta alguma alem de
# 127.0.0.1:8088 (o cloudflared roda no host e le dali).
#
# `resolver` + variavel em proxy_pass: o nginx resolve o nome do upstream a cada
# requisicao (DNS do Docker), entao o gateway sobe mesmo com uma API fora do ar
# (devolve 502 nessa rota, nao derruba as outras).
server {
    listen 8088;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 26m = maior upload real: Luna POST /transcricao aceita audio ate 25 MB
    # (kura-luna-ai luna/src/web/routers/transcricao.py:45,64-67, commit e011335, conferido
    # 2026-10-08; reproduz: sed -n '45p;64,67p' luna/src/web/routers/transcricao.py) + margem
    # do multipart. O .NET limita foto a 2 MB (PetsController.cs:228). Com 12m, audio de
    # 12-25 MB morria aqui com 413 HTML do nginx em vez do 413 JSON da Luna.
    client_max_body_size 26m;
    proxy_read_timeout 120s;    # Luna (IA) pode demorar

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # /clinica/api/v1/... -> kura-api:8080/api/v1/...   (strip do prefixo)
    location /clinica/ {
        set $up_clinica http://kura-api:8080;
        rewrite ^/clinica/(.*)$ /$1 break;
        proxy_pass $up_clinica;
    }

    # /tutor/api/v1/... -> kura-tutor:8081/api/v1/...
    location /tutor/ {
        set $up_tutor http://kura-tutor:8081;
        rewrite ^/tutor/(.*)$ /$1 break;
        proxy_pass $up_tutor;
    }

    # /luna/health -> luna-ai:8000/health
    location /luna/ {
        set $up_luna http://luna-ai:8000;
        rewrite ^/luna/(.*)$ /$1 break;
        proxy_pass $up_luna;
    }

    location / {
        return 404;
    }
}
