name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # O pin de um submódulo pode ficar atrasado só porque OUTRO repositório da KURA recebeu
  # commits no próprio main, sem nenhum push/PR neste repositório. A verificação semanal
  # sinaliza esse atraso em vez de deixá-lo ser descoberto por acaso.
  schedule:
    - cron: '0 6 * * 1' # toda segunda-feira, 06:00 UTC
  workflow_dispatch: {}

jobs:
  validate:
    name: Validate scripts and embedded compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      # Sintaxe e análise estática dos scripts de shell e do JSON do Static Web Apps.
      - name: Shell syntax, shellcheck and JSON
        run: |
          set -euo pipefail
          for f in azure/deploy.sh scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning azure/deploy.sh scripts/db-select.sh
          python3 -c "import json; json.load(open('azure/staticwebapp.config.json'))"
          node --check mongo/init/01-roles-usuarios.js

      # O bootstrap da VM é gerado por `montar_script_vm` e só roda dentro da VM (via
      # `az vm run-command`): um erro de sintaxe nele só apareceria no deploy. Aqui o script
      # é gerado e validado sem Docker e sem Azure.
      - name: Generated VM bootstrap script
        run: |
          set -euo pipefail
          sed '/^case "${1:-}" in/,$d' azure/deploy.sh > "$RUNNER_TEMP/deploy-lib.sh"
          bash -c 'source "$1" 2>/dev/null; RAIZ="$PWD"; montar_script_vm > "$2"' _ \
            "$RUNNER_TEMP/deploy-lib.sh" "$RUNNER_TEMP/vm-bootstrap.sh"
          bash -n "$RUNNER_TEMP/vm-bootstrap.sh"
          shellcheck -s bash -S warning "$RUNNER_TEMP/vm-bootstrap.sh"
          grep -q KURA_BOOTSTRAP_OK "$RUNNER_TEMP/vm-bootstrap.sh"

      # O docker-compose.yml que roda na VM está embutido no deploy.sh. Sem Docker, o que dá para
      # provar é estrutural: o YAML é válido, toda variável referenciada existe no .env gerado
      # (um `${VAR}` sem valor só quebraria na VM), nenhum segredo tem valor padrão embutido
      # (`${VAR:-...}`) e dependências e volumes apontam para itens que existem.
      - name: Embedded docker-compose (structure, no Docker)
        run: |
          python3 - <<'PY'
          import re, sys, yaml

          src = open('azure/deploy.sh', encoding='utf-8').read()

          def bloco(abre, fecha):
              m = re.search(re.escape(abre) + r"\n(.*?)\n" + fecha + r"\n", src, re.S)
              if not m:
                  sys.exit(f"bloco não encontrado no deploy.sh: {abre}")
              return m.group(1)

          compose = bloco("cat > /opt/kura/docker-compose.yml <<'YML'", "YML")
          env = bloco("cat > /opt/kura/.env <<ENV", "ENV")
          d = yaml.safe_load(compose)

          erros = []
          chaves = {l.split('=', 1)[0] for l in env.splitlines() if '=' in l}
          usadas = set(re.findall(r'(?<!\$)\$\{(\w+)', compose))
          if usadas - chaves:
              erros.append(f"variáveis usadas no compose e ausentes do .env: {sorted(usadas - chaves)}")
          if re.search(r'\$\{\w+:-', compose):
              erros.append("o compose tem valor padrão (${VAR:-...}): segredos só podem vir do .env")
          for nome, s in d['services'].items():
              for dep in (s.get('depends_on') or {}):
                  if dep not in d['services']:
                      erros.append(f"{nome} depende de serviço inexistente: {dep}")
              for v in s.get('volumes', []):
                  origem = v.split(':')[0]
                  if not origem.startswith('/') and origem not in d['volumes']:
                      erros.append(f"{nome} usa o volume não declarado: {origem}")
          for esperado in ('oracle-db', 'kura-mongo', 'mongo-init'):
              if esperado not in d['services']:
                  erros.append(f"serviço ausente: {esperado}")

          if erros:
              for e in erros:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"OK: serviços {list(d['services'])}, {len(usadas)} variáveis, todas definidas no .env")
          PY

  submodule-pin-freshness:
    name: Check submodule pins against upstream main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Sem checkout de submódulos: o commit fixado é um gitlink na árvore deste repositório
        # (`git ls-tree`) e é lido sem baixar o conteúdo do submódulo.

      # Os repositórios são públicos, mas a API do GitHub sem autenticação limita 60 chamadas/hora
      # por IP, e os runners compartilham IPs. O GITHUB_TOKEN efêmero da execução (não é um segredo
      # guardado) sobe o limite para 5000/hora.
      - name: Compare pinned submodule commits to upstream main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          declare -A REPO_MAP=(
            [dotnet-backend]=backend-clinica-dotnet
            [java-backend]=backend-tutor-java
            [luna-ia]=kura-luna-ai
            [mobile-clinica-rn]=mobile-clinica-rn
            [mobile-tutor-rn]=mobile-tutor-rn
          )

          stale=0
          while IFS= read -r line; do
            sha=$(echo "$line" | awk '{print $3}')
            path=$(echo "$line" | awk -F'\t' '{print $2}')
            repo="${REPO_MAP[$path]:-}"
            if [ -z "$repo" ]; then
              echo "::warning::submódulo '$path' sem mapeamento, ignorado"
              continue
            fi

            # `if ! upstream_sha=$(...)` é proposital: com `set -e`, uma atribuição simples que falha
            # aborta o passo inteiro antes do tratamento abaixo e deixa de checar os demais submódulos.
            if ! upstream_sha=$(curl -sSf -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/KURA-Clyvo/${repo}/commits/main" | jq -r '.sha // empty'); then
              echo "::error::não foi possível obter o SHA do main de ${repo} (KURA-Clyvo/${repo}); veja o stderr acima"
              stale=1
              continue
            fi

            if [ -z "$upstream_sha" ]; then
              echo "::error::o SHA do main de ${repo} (KURA-Clyvo/${repo}) veio vazio: resposta inesperada da API"
              stale=1
              continue
            fi

            if [ "$sha" != "$upstream_sha" ]; then
              echo "::error::submódulo '${path}' (KURA-Clyvo/${repo}) fixado em ${sha}, mas o main está em ${upstream_sha}. Atualize: cd ${path} && git fetch && git checkout main && cd .. && git add ${path} && git commit."
              stale=1
            else
              echo "OK: ${path} (${repo}) fixado no HEAD do main (${sha})"
            fi
          done < <(git ls-tree HEAD -- dotnet-backend java-backend luna-ia mobile-clinica-rn mobile-tutor-rn)

          exit $stale
